name: Build and Publish Python Package

on:
  push:
    branches:
      - develop # Or your default branch
  workflow_dispatch: # Allow manual trigger

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-publish-python:
    runs-on: ubuntu-latest
    permissions:
      contents: read # Needed for checkout
      id-token: write # Needed for trusted publishing

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Set up Python environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # ---- Step 1: Install minimal dependencies for check ----
      - name: Install check dependencies
        run: |
          python -m pip install --upgrade pip requests

      # ---- Step 2: Read package metadata from pyproject.toml ----
      - name: Read package metadata from pyproject.toml
        id: package_meta
        run: |
          python - <<'PY'
          import os
          import tomllib

          with open("pyproject.toml", "rb") as f:
              project = tomllib.load(f)["project"]

          package_name = project["name"]
          package_version = project["version"]

          print(f"Package: {package_name}")
          print(f"Version: {package_version}")

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write(f"package_name={package_name}\n")
              out.write(f"package_version={package_version}\n")
          PY

      # ---- Step 3: Check if version is a dev/rc release and not already on PyPI ----
      - name: Check if version exists on PyPI
        id: check_version
        run: |
          python - <<'PY'
          import os
          import requests

          package_name = "${{ steps.package_meta.outputs.package_name }}"
          version = "${{ steps.package_meta.outputs.package_version }}"

          print(f"Checking Package: {package_name}")
          print(f"Checking Version: {version}")

          should_publish = "true"

          # Only dev or rc versions are published from this workflow.
          if "dev" not in version and "rc" not in version:
              print(f"Version {version} is not a dev or rc version. Skipping publish.")
              should_publish = "false"
          else:
              url = f"https://pypi.org/pypi/{package_name}/{version}/json"
              print(f"Version {version} is a dev or rc version. Checking URL: {url}")
              try:
                  response = requests.get(url, timeout=30)
                  if response.status_code == 404:
                      print(f"Version {version} not found on PyPI. Proceeding.")
                  elif response.status_code == 200:
                      print(f"Version {version} already exists on PyPI. Skipping publish.")
                      should_publish = "false"
                  else:
                      print(f"Unexpected PyPI response: {response.status_code}")
                      print("Proceeding with publish attempt.")
              except Exception as exc:
                  print(f"Version check failed: {exc}")
                  print("Proceeding with publish attempt.")

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write(f"should_publish={should_publish}\n")
          PY

      # ---- Step 4: Install build dependencies (Conditional) ----
      - name: Install build dependencies
        if: steps.check_version.outputs.should_publish == 'true'
        run: |
          python -m pip install --upgrade setuptools wheel build

      # ---- Step 5: Build the package (Conditional) ----
      - name: Build the package
        if: steps.check_version.outputs.should_publish == 'true'
        run: |
          python -m build

      # ---- Step 6: Publish package to PyPI via Trusted Publishing (Conditional) ----
      - name: Publish package to PyPI
        if: steps.check_version.outputs.should_publish == 'true'
        uses: pypa/gh-action-pypi-publish@release/v1

      # ---- Optional Step: Report Skipped Publish ----
      - name: Report skipped publish (if applicable)
        if: steps.check_version.outputs.should_publish == 'false'
        run: |
          echo "Publish skipped because version found on PyPI or version is not a dev/rc version."
