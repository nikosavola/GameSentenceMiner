name: CI Checks

on:
  push:
    branches:
      - main
      - develop
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ts:
    name: TypeScript tests & type-check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run TypeScript tests
        run: npm run test:ts

      - name: Type-check
        run: npx tsc --noEmit -p tsconfig.electron.json

  lint-py:
    name: Python lint & format
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
          enable-cache: true

      - name: Check Python formatting
        run: uv run --extra dev ruff format --check GameSentenceMiner tests scripts

      - name: Lint Python
        run: uv run --extra dev ruff check GameSentenceMiner tests scripts
